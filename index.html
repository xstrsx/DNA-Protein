    g.gain.exponentialRampToValueAtTime(.0001,now+dur+1.4);
    const g2=ctx.createGain();g2.gain.value=idx<2?.18:.08;

  g.gain.linearRampToValueAtTime(vol,now+.018);
  g.gain.exponentialRampToValueAtTime(.0001,now+dur);
  o1.connect(flt);o2.connect(g2);g2.connect(flt);flt.connect(g);
  if(pan){pan.pan.value=panVal||0;g.connect(pan);pan.connect(musicGain)}
  else g.connect(musicGain);
  o1.start(now);o2.start(now);o1.stop(now+dur+.05);o2.stop(now+dur+.05);
}

// 抒情旋律独奏音色 (用于转录/翻译/终章主题)
function playLead(m,dur,vol){
  if(!ctx||!active)return;
  const now=ctx.currentTime,f=m2f(m),o=ctx.createOscillator(),vib=ctx.createOscillator(),vg=ctx.createGain(),flt=ctx.createBiquadFilter(),g=ctx.createGain();
  o.type='triangle';o.frequency.value=f;
  vib.frequency.value=5.2;vg.gain.value=f*.006;
  vib.connect(vg);vg.connect(o.frequency);
  flt.type='lowpass';flt.frequency.setValueAtTime(f*2.6,now);
  flt.frequency.exponentialRampToValueAtTime(f*1.3,now+dur);
  g.gain.setValueAtTime(.0001,now);
  g.gain.linearRampToValueAtTime(vol,now+Math.min(.22,dur*.25));
  g.gain.setValueAtTime(vol*.8,now+dur*.6);
  g.gain.exponentialRampToValueAtTime(.0001,now+dur+.35);
  o.connect(flt);flt.connect(g);g.connect(musicGain);
  o.start(now);vib.start(now);o.stop(now+dur+.4);vib.stop(now+dur+.4);
}

// 场景专属分子音效 (核孔穿梭、解旋微脉冲、肽键合成水分子闪烁、蛋白质折叠光辉)
function playShimmer(baseMidi,count,spread,vol){
  if(!ctx||!active)return;
  const scale=[0,4,7,11,14,18,21];
  for(let i=0;i<count;i++){
    const delay=i*spread,m=baseMidi+scale[i%scale.length];
    setTimeout(()=>{if(active)playPluck(m,1.4,vol*(1-i/(count*1.6)),(i%2?.45:-.45),true)},delay*1000);
  }
}

function tick(t,dt,isPlaying){
  if(!isPlaying||!ctx){active=false;return}
  if(ctx.state==='suspended')ctx.resume();
  active=true;
  if(Math.abs(t-lastT)>1.2){lastStep=-1;padTimer=0}
  lastT=t;

  const ch=getChap(t);
  const progress=(t-ch.t0)/Math.max(1,ch.t1-ch.t0);
  const chordIdx=Math.floor((t-ch.t0)/ch.padDur)%ch.chords.length;
  const chord=ch.chords[chordIdx];

  // 1. 铺底和弦触发
  padTimer-=dt;
  if(padTimer<=0){
    padTimer=ch.padDur*.88;
    const bright=t<17?.45:t<56?.7:t<108?.65:t<142?.85:.95;
    const fadeOut=t>216?Math.max(.15,1-(t-216)/6):1;
    playPadChord(chord,ch.padDur*1.05,.24*fadeOut,bright);
  }

  // 2. 节拍步进器 (琶音与主题旋律)
  const step=Math.floor(t/ch.step);
  if(step!==lastStep){
    lastStep=step;
    const fadeOut=t>216?Math.max(.1,1-(t-216)/5):1;
    // 根据不同阶段编排织体密度
    if(t<17){
      // 序章：稀疏晶莹的水滴泛音，穿核孔(8-12s)时上行闪烁
      if(step%2===0){
        const n=ch.arp[(step/2)%ch.arp.length]+(t>8&&t<13?12:0);
        playPluck(n,1.8,.085*fadeOut,Math.sin(step)*.5,true);
      }
    }else if(t<56){
      // DNA 复制：解旋与聚合的精密律动琶音
      const pat=[0,2,4,1,3,5,4,2];
      const idx=pat[step%pat.length];
      const oct=(step%16===0||step%16===6)?12:0;
      playPluck(ch.arp[idx%ch.arp.length]+oct,.65,.09*fadeOut,((step%4)-1.5)*.35,step%4===0);
      if(step%8===0){
        // 低音根音轻柔脉动
        playPluck(chord[0]+12,1.5,.11*fadeOut,0,false);
      }
      if(t>40&&step%4===2){
        // 半保留复制完成时加入温暖高音旋律
        playLead(ch.mel[(step>>2)%ch.mel.length],1.4,.065*fadeOut);
      }
    }else if(t<108){
      // 转录与剪接出核：流淌的竖琴琶音 + 抒情木管旋律
      const idx=(step*3+(step>>2))%ch.arp.length;
      const isPore=t>93&&t<106;
      playPluck(ch.arp[idx]+(isPore?12:0),1.1,.08*fadeOut,Math.cos(step*.8)*.5,isPore);
      if(step%4===0){
        const mNote=ch.mel[(step/4)%ch.mel.length];
        playLead(mNote,ch.step*3.4,.075*fadeOut);
      }
    }else if(t<142){
      // 翻译：核糖体装配的灵动三拍/四拍律动
      const idx=step%ch.arp.length;
      playPluck(ch.arp[idx],.8,.085*fadeOut,Math.sin(step*1.2)*.45,step%3===0);
      if(step%6===0){
        playLead(ch.mel[(step/6)%ch.mel.length],ch.step*4.2,.07*fadeOut);
      }
    }else{
      // 蛋白质成熟、高尔基体分选、SNARE 质膜融合与胞吐全景
      if(step%2===0){
        const idx=(step/2)%ch.arp.length;
        playPluck(ch.arp[idx],2.1,.09*fadeOut,Math.sin(step*.7)*.55,true);
      }
      if(step%4===0&&t<218){
        playLead(ch.mel[(step/4)%ch.mel.length],1.9,.08*fadeOut);
      }
    }
  }

  // 3. 关键分子事件同步点缀音 (成肽反应、伴侣供能、蛋白酶体降解、修饰、四级组装、协同催化、高尔基成熟、SNARE胞吐、终章)
  const bEvt=t<116?
    (t>=88.5&&t<90.5?88:-1):
    t<141?Math.floor((t-116.8)/2.6):
    t>=142.5&&t<144.5?91:
    t>=148.5&&t<150.5?92:
    t>=157.0&&t<159.0?93:
    t>=166.5&&t<168.5?94:
    t>=177.0&&t<179.0?95:
    t>=185.5&&t<187.5?96:
    t>=193.0&&t<195.5?97:
    t>=202.0&&t<204.5?99:
    t>=209.0&&t<212.0?98:
    -1;

  if(bEvt!==lastBond){
    lastBond=bEvt;
    if(bEvt>=1&&bEvt<=8){
      playShimmer(74+(bEvt%4)*2,2,.09,.085);
    }else if(bEvt===88){
      playShimmer(72,4,.10,.09);
    }else if(bEvt===91){
      playShimmer(64,4,.10,.08);
    }else if(bEvt===92){
      playShimmer(76,3,.12,.085);
    }else if(bEvt===93){
      playShimmer(58,4,.11,.08);
    }else if(bEvt===94){
      playShimmer(79,4,.10,.09);
    }else if(bEvt===95){
      playShimmer(67,5,.09,.095);
    }else if(bEvt===96){
      playShimmer(72,6,.08,.095);
    }else if(bEvt===97){
      playShimmer(74,4,.11,.085);
    }else if(bEvt===99){
      playShimmer(81,5,.08,.095);
    }else if(bEvt===98){
      playShimmer(62,8,.10,.10);
    }
  }
}

function setPlayState(p){
  if(p){
    init();
    if(ctx&&ctx.state==='suspended')ctx.resume();
    active=true;
  }else{
    active=false;
  }
}

function toggleMute(){
  init();
  muted=!muted;
  if(master&&ctx)master.gain.setTargetAtTime(muted?0:.82,ctx.currentTime,.06);
  return muted;
}

return{tick,setPlayState,toggleMute,isMuted:()=>muted};
